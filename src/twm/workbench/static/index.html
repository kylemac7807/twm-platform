<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="mark"><div class="sq" aria-hidden="true"></div><span class="name">Review workbench</span><span class="tag">prototype</span></div>
  <nav class="nav" id="nav">
    <button data-screen="overview">Overview</button>
    <button data-screen="queue">Queue <span class="n" id="nav-open">–</span></button>
    <button data-screen="documents">Documents</button>
    <button data-screen="rules">Rules</button>
  </nav>
  <div class="who"><label for="analyst">Your name</label><input id="analyst" type="text" placeholder="recorded on every decision" autocomplete="off"></div>
</header>
<main class="page" id="page"><p class="muted">Loading the ledger…</p></main>
<footer class="foot">
  <span>This session: <b id="foot-decisions">0</b> decisions recorded</span>
  <span><b id="foot-left">–</b> titles waiting</span>
  <span class="right" id="foot-ledger"></span>
</footer>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
