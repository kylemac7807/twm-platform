<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="mark"><div class="sq" aria-hidden="true"></div><span class="name">Review workbench</span><span class="tag">prototype</span></div>
  <nav class="nav" id="nav">
    <button data-screen="sets">Contract sets</button>
    <button data-screen="review">Review <span class="n" id="nav-open">–</span></button>
    <button data-screen="documents">Documents</button>
    <button data-screen="rules">Global Framework Updates</button>
  </nav>
  <div class="who"><label for="analyst" id="who-label">Your name</label><input id="analyst" type="text" placeholder="saved with each answer" autocomplete="off"><span id="who-set" hidden><b id="who-name"></b> <a href="#" id="who-change">change</a></span></div>
</header>
<main class="page" id="page"><p class="muted">Loading…</p></main>
<footer class="foot">
  <span id="foot-set" class="muted">No contract set chosen</span>
  <span>Saved this session: <b id="foot-saved">0</b></span>
  <span class="right">Answers take effect as soon as you save them.</span>
</footer>
<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
